name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      results_only: ${{ steps.verify.outputs.results_only }}
      tests_required: ${{ steps.verify.outputs.tests_required }}
    env:
      TM_REQUIRE_PTRACE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify source changes and result evidence
        id: verify
        env:
          TM_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TM_DIFF_HEAD: ${{ github.sha }}
          TM_TRUST_POLICY_JSON: ${{ vars.TM_TRUST_POLICY_JSON }}
        run: |
          bash scripts/tm-ci-run-tests.sh "$TM_DIFF_BASE" "$TM_DIFF_HEAD"

  portable-acceptance:
    needs: test
    # This job uses privileged Docker. Keep it to trusted default-branch pushes;
    # the runner group must independently restrict access to this workflow on main.
    if: >-
      github.event_name == 'push' &&
      vars.TM_PORTABLE_ACCEPTANCE_ENABLED == 'true' &&
      needs.test.outputs.tests_required == 'true'
    runs-on:
      group: tm-portable-acceptance
      labels: tm-portable-acceptance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify signed cross-worktree reuse
        env:
          TM_ACCEPTANCE_SHARED_STORE: ${{ vars.TM_ACCEPTANCE_SHARED_STORE }}
        run: |
          acceptance_uid=$(id -u)
          docker_args=(
            --rm
            --privileged
            --volume "$GITHUB_WORKSPACE:/repo:ro"
            --env "TM_ACCEPTANCE_SHARED_STORE=$TM_ACCEPTANCE_SHARED_STORE"
            --env "TM_ACCEPTANCE_UID=$acceptance_uid"
          )
          if [[ -n "$TM_ACCEPTANCE_SHARED_STORE" ]]; then
            docker_args+=(
              --volume "$TM_ACCEPTANCE_SHARED_STORE:$TM_ACCEPTANCE_SHARED_STORE"
            )
          fi
          docker run "${docker_args[@]}" debian:bookworm-slim sh -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes \
              --no-install-recommends build-essential bubblewrap \
              busybox-static git jq libssl-dev sudo
            useradd --uid "$TM_ACCEPTANCE_UID" --create-home \
              --shell /bin/bash tester
            printf "tester ALL=(ALL) NOPASSWD:ALL\\n" \
              >/etc/sudoers.d/tester
            chmod 0440 /etc/sudoers.d/tester
            sudo -u tester -H git config --global --add safe.directory /repo
            sudo -u tester -H git config --global --add safe.directory /repo/.git
            sudo -u tester -H git clone --quiet --no-hardlinks --local \
              /repo /home/tester/testmiser
            sudo -u tester -H env \
              TM_ACCEPTANCE_SHARED_STORE="$TM_ACCEPTANCE_SHARED_STORE" \
              TM_REQUIRE_PTRACE=1 bash -c \
              "cd /home/tester/testmiser && bash tests/portable-reuse-ci.sh"
          '

  portable-acceptance-policy:
    needs: [test, portable-acceptance]
    # A conditionally skipped job is reported as successful by GitHub. Keep an
    # unconditional policy check so a main-branch code change cannot look
    # acceptance-qualified while the privileged gate is disabled or missing.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require portable acceptance for main-branch code changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TESTS_REQUIRED: ${{ needs.test.outputs.tests_required }}
          ACCEPTANCE_RESULT: ${{ needs.portable-acceptance.result }}
        run: bash scripts/tm-github-acceptance-policy.sh
