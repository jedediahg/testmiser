name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      results_only: ${{ steps.verify.outputs.results_only }}
    env:
      TM_REQUIRE_PTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source changes and result evidence
        id: verify
        env:
          TM_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TM_DIFF_HEAD: ${{ github.sha }}
          TM_TRUST_POLICY_JSON: ${{ vars.TM_TRUST_POLICY_JSON }}
        run: |
          results_only=false
          has_results=false
          if bash scripts/tm-result-diff.sh any "$TM_DIFF_BASE" "$TM_DIFF_HEAD"; then
            has_results=true
            if bash scripts/tm-result-diff.sh only "$TM_DIFF_BASE" "$TM_DIFF_HEAD"; then
              results_only=true
            fi
          fi
          echo "results_only=$results_only" >> "$GITHUB_OUTPUT"

          if [[ "$results_only" == true ]]; then
            echo "Result-only change: validating trusted evidence without running unrelated tests."
          else
            TM_REQUIRE_PTRACE=1 make clean test
            TM_REQUIRE_PTRACE=1 make analyze
          fi

          if [[ "$has_results" == true ]]; then
            bash scripts/tm-ci-validate-results.sh
          fi

  portable-acceptance:
    needs: test
    if: needs.test.outputs.results_only != 'true'
    runs-on: ${{ vars.TM_PORTABLE_ACCEPTANCE_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify signed cross-worktree reuse
        env:
          TM_ACCEPTANCE_SHARED_STORE: ${{ vars.TM_ACCEPTANCE_SHARED_STORE }}
        run: |
          acceptance_uid=$(id -u)
          docker_args=(
            --rm
            --privileged
            --volume "$GITHUB_WORKSPACE:/repo:ro"
            --env "TM_ACCEPTANCE_SHARED_STORE=$TM_ACCEPTANCE_SHARED_STORE"
            --env "TM_ACCEPTANCE_UID=$acceptance_uid"
          )
          if [[ -n "$TM_ACCEPTANCE_SHARED_STORE" ]]; then
            docker_args+=(
              --volume "$TM_ACCEPTANCE_SHARED_STORE:$TM_ACCEPTANCE_SHARED_STORE"
            )
          fi
          docker run "${docker_args[@]}" debian:bookworm-slim sh -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes \
              --no-install-recommends build-essential bubblewrap \
              busybox-static git jq libssl-dev sudo
            useradd --uid "$TM_ACCEPTANCE_UID" --create-home \
              --shell /bin/bash tester
            printf "tester ALL=(ALL) NOPASSWD:ALL\\n" \
              >/etc/sudoers.d/tester
            chmod 0440 /etc/sudoers.d/tester
            sudo -u tester -H git config --global --add safe.directory /repo
            sudo -u tester -H git config --global --add safe.directory /repo/.git
            sudo -u tester -H git clone --quiet --no-hardlinks --local \
              /repo /home/tester/testmiser
            sudo -u tester -H env \
              TM_ACCEPTANCE_SHARED_STORE="$TM_ACCEPTANCE_SHARED_STORE" \
              TM_REQUIRE_PTRACE=1 bash -c \
              "cd /home/tester/testmiser && bash tests/portable-reuse-ci.sh"
          '
