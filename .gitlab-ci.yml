image: debian:bookworm-slim

variables:
  GIT_DEPTH: "0"
  TM_REQUIRE_PTRACE: "1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test

test:
  stage: test
  interruptible: true
  rules:
    - changes:
        - .tm/results/**/*
        - .tm/blobs/**/*
        - .tm/profiles/**/*
        - src/**/*
        - include/**/*
        - tests/**/*
        - scripts/**/*
        - docs/spec/**/*
        - Makefile
        - .gitlab-ci.yml
        - .github/workflows/ci.yml
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends build-essential libssl-dev ca-certificates git
  script:
    - |
      set -eu
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
      classification=$(bash scripts/tm-ci-classify-changes.sh \
        "$base" "$CI_COMMIT_SHA")
      tests_required=$(printf '%s\n' "$classification" |
        sed -n 's/^tests_required=//p')
      has_results=$(printf '%s\n' "$classification" |
        sed -n 's/^has_results=//p')
      results_only=$(printf '%s\n' "$classification" |
        sed -n 's/^results_only=//p')
      if [ "$results_only" = true ]; then
        echo "Result-only change; skipping unrelated application tests."
      elif [ "$tests_required" = true ]; then
        TM_REQUIRE_PTRACE=1 make clean test
        TM_REQUIRE_PTRACE=1 make analyze
      else
        echo "No test-relevant source changes."
      fi
      if [ "$has_results" = true ]; then
        bash scripts/tm-ci-validate-results.sh
      else
        echo "No result sidecars changed."
      fi

portable_acceptance:
  stage: test
  interruptible: true
  rules:
    - changes:
        - .tm/profiles/**/*
        - src/**/*
        - include/**/*
        - tests/**/*
        - scripts/**/*
        - docs/spec/**/*
        - Makefile
        - .gitlab-ci.yml
        - .github/workflows/ci.yml
  tags:
    - linux-bwrap
  needs:
    - test
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends build-essential libssl-dev bubblewrap busybox-static jq sudo git
  script:
    - |
      useradd --create-home --shell /bin/bash tm-acceptance
      printf 'tm-acceptance ALL=(ALL) NOPASSWD:ALL\n' >/etc/sudoers.d/tm-acceptance
      chmod 0440 /etc/sudoers.d/tm-acceptance
      sudo -u tm-acceptance -H git config --global --add safe.directory "$CI_PROJECT_DIR"
      sudo -u tm-acceptance -H git config --global --add safe.directory "$CI_PROJECT_DIR/.git"
      sudo -u tm-acceptance -H git clone --quiet --no-hardlinks --local \
        "$CI_PROJECT_DIR" /home/tm-acceptance/testmiser
      sudo -u tm-acceptance -H env \
        TM_ACCEPTANCE_SHARED_STORE="${TM_ACCEPTANCE_SHARED_STORE:-}" \
        TM_REQUIRE_PTRACE=1 bash -c \
        'cd /home/tm-acceptance/testmiser && bash tests/portable-reuse-ci.sh'
