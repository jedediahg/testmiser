workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

stages:
  - verify
  - portable-acceptance

verify:
  stage: verify
  image: debian:bookworm-slim
  interruptible: true
  variables:
    GIT_DEPTH: "0"
    TM_REQUIRE_PTRACE: "1"
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential ca-certificates git libssl-dev make
  script:
    - |
      if [ -n "${TM_CI_TRUST_POLICY_FILE:-}" ]; then
        export TM_TRUST_POLICY_FILE="$TM_CI_TRUST_POLICY_FILE"
      fi
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
      bash scripts/tm-ci-run-tests.sh "$base" "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &verify_changes
        - Makefile
        - .gitlab-ci.yml
        - .github/workflows/**
        - .tm/profiles/**
        - include/**
        - src/**
        - tests/**
        - scripts/**
        - docs/spec/**
        - .tm/results/**
        - .tm/blobs/**
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule"'
      changes: *verify_changes

portable-acceptance:
  stage: portable-acceptance
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  interruptible: true
  variables:
    GIT_DEPTH: "0"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  tags:
    - linux-bwrap
  needs:
    - job: verify
      artifacts: false
  script:
    - docker info
    - |
      acceptance_uid=$(id -u)
      if [ "$acceptance_uid" -eq 0 ]; then
        acceptance_uid=1000
      fi
      if [ -n "${TM_ACCEPTANCE_SHARED_STORE:-}" ]; then
        docker run --rm --privileged \
          --volume "$CI_PROJECT_DIR:/repo:ro" \
          --volume "$TM_ACCEPTANCE_SHARED_STORE:$TM_ACCEPTANCE_SHARED_STORE" \
          --env "TM_ACCEPTANCE_UID=$acceptance_uid" \
          --env "TM_ACCEPTANCE_SHARED_STORE=$TM_ACCEPTANCE_SHARED_STORE" \
          debian:bookworm-slim sh -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes \
              --no-install-recommends build-essential bubblewrap \
              busybox-static git jq libssl-dev sudo
            useradd --uid "$TM_ACCEPTANCE_UID" --create-home \
              --shell /bin/bash tester
            printf "tester ALL=(ALL) NOPASSWD:ALL\\n" \
              >/etc/sudoers.d/tester
            chmod 0440 /etc/sudoers.d/tester
            sudo -u tester -H git config --global --add safe.directory /repo
            sudo -u tester -H git config --global --add safe.directory /repo/.git
            sudo -u tester -H git clone --quiet --no-hardlinks --local \
              /repo /home/tester/testmiser
            sudo -u tester -H env \
              TM_ACCEPTANCE_SHARED_STORE="$TM_ACCEPTANCE_SHARED_STORE" \
              TM_REQUIRE_PTRACE=1 bash -c \
              "cd /home/tester/testmiser && bash tests/portable-reuse-ci.sh"
          '
      else
        docker run --rm --privileged \
          --volume "$CI_PROJECT_DIR:/repo:ro" \
          --env "TM_ACCEPTANCE_UID=$acceptance_uid" \
          debian:bookworm-slim sh -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes \
              --no-install-recommends build-essential bubblewrap \
              busybox-static git jq libssl-dev sudo
            useradd --uid "$TM_ACCEPTANCE_UID" --create-home \
              --shell /bin/bash tester
            printf "tester ALL=(ALL) NOPASSWD:ALL\\n" \
              >/etc/sudoers.d/tester
            chmod 0440 /etc/sudoers.d/tester
            sudo -u tester -H git config --global --add safe.directory /repo
            sudo -u tester -H git config --global --add safe.directory /repo/.git
            sudo -u tester -H git clone --quiet --no-hardlinks --local \
              /repo /home/tester/testmiser
            sudo -u tester -H env TM_REQUIRE_PTRACE=1 bash -c \
              "cd /home/tester/testmiser && bash tests/portable-reuse-ci.sh"
          '
      fi
  rules:
    # Privileged Docker runs only on server-protected refs. Fork and ordinary
    # merge requests use the verification job and qualify after a trusted push.
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH || $CI_COMMIT_TAG)'
      changes: &acceptance_changes
        - Makefile
        - .gitlab-ci.yml
        - .github/workflows/**
        - .tm/profiles/**
        - include/**
        - src/**
        - tests/**
        - scripts/**
